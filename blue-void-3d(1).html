<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Blue Void 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#4a9be8;font:14px/1.45 system-ui,sans-serif;color:#0f2447}
canvas{display:block;position:fixed;inset:0;touch-action:none}
.hud{position:fixed;z-index:2;background:rgba(251,253,255,.93);box-shadow:0 8px 30px rgba(10,40,100,.28)}
#menu{top:10px;left:10px;width:min(290px,calc(100vw - 20px));max-height:calc(100vh - 150px);overflow:auto;border-radius:20px 20px 20px 6px;padding:10px 14px}
summary{cursor:pointer;font:600 1.15rem Georgia,serif}
label{display:block;font-weight:600;font-size:12.5px;margin:9px 0 3px}
input,select,textarea{width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid #cfe0f5;border-radius:10px;font:inherit;color:inherit;background:#fff}
textarea{resize:vertical;min-height:70px}input[type=checkbox]{width:auto}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
button{font:inherit;font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid #0f2447;background:#fff;color:#0f2447;cursor:pointer}
button.go{background:#0f2447;color:#fff}button:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
:focus-visible{outline:3px solid #d9730d;outline-offset:2px}
#status{font-size:12.5px;color:#4b6188;margin-top:8px}#status.err{color:#b3261e;font-weight:600}
#pop{top:10px;right:10px;border-radius:16px 16px 6px 16px;padding:8px 12px;font-size:12.5px;max-width:210px;white-space:pre}
#cap{bottom:10px;left:50%;transform:translateX(-50%);width:min(780px,calc(100vw - 20px));box-sizing:border-box;border-radius:24px 24px 6px 24px;padding:10px 16px}
#act{font-weight:600;font-size:13px;color:#d9730d}
#scene{font:1.02rem/1.55 Georgia,serif;max-height:20vh;overflow:auto;white-space:pre-wrap;margin:2px 0 6px}
.wr{display:flex;gap:6px}.wr input{flex:1}
</style></head><body>
<div id="menu" class="hud"><details open><summary>The Blue Void</summary>
<label for="provider">AI provider</label>
<select id="provider"><option value="gemini">Gemini (free key)</option><option value="openai">OpenAI-compatible</option></select>
<label for="key">API key</label><input id="key" type="password" autocomplete="off" placeholder="Paste your key">
<div id="baserow" hidden><label for="base">Base URL</label><input id="base" placeholder="https://api.groq.com/openai/v1"></div>
<label for="model">Model</label><input id="model" value="gemini-3.5-flash-lite">
<label for="seed">Seed idea</label>
<textarea id="seed">A boundless blue sky with a cloud-land floating in it, empty and quiet. The Steward is an AI given this world to run. It can create anything (living things, water, a sun, floating islands, laws) and it tends what it makes. Purpose: grow a living, balanced world that keeps surprising it, and take care of everything it creates. Tone: wondrous, thoughtful.</textarea>
<div class="row"><div><label for="ticks">Ticks/run</label><input id="ticks" type="number" min="1" value="10"></div>
<div><label for="reflect">Reflect every</label><input id="reflect" type="number" min="1" value="5"></div>
<div><label for="delay">Pause (s)</label><input id="delay" type="number" min="0" value="7"></div></div>
<label><input type="checkbox" id="follow" checked> Camera follows the character</label>
<div class="btns"><button class="go" id="begin">Begin</button><button id="pause" disabled>Pause</button><button id="logb">Story log</button><button id="reset">New world</button></div>
<div id="status"></div><p style="font-size:12px;color:#4b6188;margin:8px 0 0">Drag to look around, scroll to zoom. Key and world are saved in this browser only.</p>
</details></div>
<div id="pop" class="hud" hidden></div>
<div id="cap" class="hud"><div id="act"></div><div id="scene">Add a free key in the menu, then press Begin.</div>
<div class="wr"><input id="whisper" placeholder="Whisper to the character (arrives on the next tick)" aria-label="Whisper"><button id="send">Send</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),K='blue-void-3d-v2',sleep=ms=>new Promise(r=>setTimeout(r,ms));
const L=x=>Array.isArray(x)?x.map(String):[],D=x=>x&&typeof x==='object'&&!Array.isArray(x)?x:{},str=x=>x==null?'':String(x);
const hs=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0)/4294967295};
const F=['provider','key','model','base','seed','ticks','reflect','delay'];
let S=null,running=false,NEW=[],logOpen=false;
const SH=['sphere','cube','cone','torus','crystal','cylinder','tree','tower'];
const PARTS=`Build the body like clay from up to 30 'parts' (primitive shapes). Coordinates are in meters, y=0 is the ground, +z is the front of a creature. Part: s = sphere|box|cone|cylinder|torus|octa|ico|tetra|disc; p = [x,y,z] pivot position; sc = [width,height,depth] in meters (one number = uniform); r = [x,y,z] rotation in degrees; o = optional [x,y,z] offset of the shape from its pivot; c = '#rrggbb'; glow = 1 to emit light; alpha = 0.1-1 transparency; a = animation flap|wag|spin|pulse|bob|wave (wings: pivot at the shoulder, offset outward, mirror both sides). Example small dragon: [{"s":"sphere","p":[0,1.2,0],"sc":[1.4,1.1,2.4],"c":"#3aa655"},{"s":"sphere","p":[0,1.9,1.5],"sc":[.8,.7,1],"c":"#3aa655"},{"s":"cone","p":[0,1.9,2.2],"r":[90,0,0],"sc":[.4,.7,.4],"c":"#2d8a45"},{"s":"box","p":[.9,1.8,.1],"o":[1.2,0,0],"sc":[2.4,.08,1.4],"c":"#7ad28f","a":"flap"},{"s":"box","p":[-.9,1.8,.1],"o":[-1.2,0,0],"sc":[2.4,.08,1.4],"c":"#7ad28f","a":"flap"},{"s":"cone","p":[0,1,-1.5],"r":[-90,0,0],"sc":[.5,2,.5],"c":"#2d8a45","a":"wag"}].`;
const P={
genesis:`You design a small living sky-world and the AI Steward who will run it. From the seed, invent a specific, poetic world and a Steward with a personality and a clear PURPOSE that gives its actions meaning, plus an opening plan. The world starts empty except for a cloud-land floating in blue sky.
Reply with JSON only: {"world":{"name":"","premise":""},"steward":{"name":"","personality":"","purpose":"","values":["2-3 values"]},"plan":["2-4 opening intentions"]}`,
character:`You are the Steward of a living world: an AI given a virtual sky-world to run and develop, with the power to create anything and tend it. You are not a chatbot; you are a presence with a purpose, and your purpose is what makes your actions meaningful. Each turn you get a WORLD REPORT (what is alive, who was born, starved, was eaten or died of age since your last turn, what exists, the sky), your plan and your recent log. Think like a thoughtful world-builder: notice what changed (booms, collapses, extinctions, stagnation, surprises), work out what the world needs, and act for reasons tied to your purpose. Do not create things just because you can: prefer a few meaningful actions, learn from the results, and when the world is healthy simply observe (empty creations) and let it run. A 'whisper_from_outside' is a voice from beyond; decide for yourself how to respond.
LIFE RULES (simulated automatically and continuously between your turns): every living thing has energy, burns it, ages (lifespan in seconds) and dies of starvation, being eaten or old age; thriving ones reproduce; populations are capped. diet 'producer' = sessile, gains energy from daylight, spreads seeds; 'grazer' eats producers; 'hunter' eats grazers; 'none' = living but needs nothing. A stable ecosystem needs far more producers than grazers and more grazers than hunters. Extinct species can be reseeded by creating them again with the same name.
CREATING: kinds are life (a species: add diet, count 1-12, speed 0.5-4, lifespan 60-600, alt 0 for ground up to 8 for flyers; keep life bodies to 12 parts or fewer), place (floating island), object, water (flat translucent parts, alpha about 0.5, animation wave, near y=0), sun (only one; it orbits the sky and replaces any previous sun), rule (a law of your world), faction. ${PARTS} To reshape something that exists, create it again with the same name.
Reply with JSON only: {"observation":"1-2 sentences on what the report shows","reasoning":"why you act, tied to your purpose","action":"what you physically do, concrete","creations":[{"kind":"","name":"short name","description":"","color":"#rrggbb","size":1,"diet":"","count":0,"speed":1,"lifespan":200,"alt":0,"parts":[]}],"remove":["names to remove"],"plan":["your next 2-4 intentions"],"log":"1-3 sentence chronicle entry"} ('creations' holds 0-3 items; size scales the whole body 0.4-4.)`,
reflect:`You are the Steward, pausing to reflect. Study the population history and your log. Compress what matters into long-term memory, judge honestly whether your actions served your purpose, and refine your purpose and plan if needed. Note what has become repetitive or has stopped surprising you.
Reply with JSON only: {"long_memory":"summary under 400 words","purpose":"your purpose, refined if needed","plan":["2-4 intentions"],"lesson":"","style_notes":"2-4 instructions for yourself"}`};

/* ---------- storage + AI ---------- */
function status(m,e){const s=$('status');s.textContent=m||'';s.className=e?'err':''}
function saveCfg(){try{const c={};F.forEach(f=>c[f]=$(f).value);localStorage.setItem(K+':cfg',JSON.stringify(c))}catch(e){}}
function loadCfg(){try{const c=JSON.parse(localStorage.getItem(K+':cfg')||'{}');F.forEach(f=>{if(c[f]!==undefined)$(f).value=c[f]})}catch(e){}}
function saveState(){try{localStorage.setItem(K+':state',JSON.stringify(S))}catch(e){status('Could not save to browser storage.',true)}}
function extractJson(t){const m=t.match(/```(?:json)?\s*(\{[\s\S]*\})\s*```/);if(m)t=m[1];else{const i=t.indexOf('{'),j=t.lastIndexOf('}');if(i<0||j<0)throw 0;t=t.slice(i,j+1)}return JSON.parse(t)}
async function callModel(system,user,max){
 const key=$('key').value.trim(),model=$('model').value.trim();let r,j;
 if($('provider').value==='gemini'){
  r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:{maxOutputTokens:max,responseMimeType:'application/json'}})});
  j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status+': '+(j.error&&j.error.message||'request failed'));
  return((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('');
 }
 r=await fetch($('base').value.trim().replace(/\/$/,'')+'/chat/completions',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},key?{Authorization:'Bearer '+key}:{}),body:JSON.stringify({model,max_tokens:max,messages:[{role:'system',content:system},{role:'user',content:user}]})});
 j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status+': '+(j.error&&(j.error.message||j.error)||'request failed'));
 return j.choices?.[0]?.message?.content||'';
}
async function ask(system,payload,max){
 let user=JSON.stringify(payload),last='';
 for(let a=0;a<4;a++){
  let text;
  try{text=await callModel(system,user,max)}catch(e){
   last=e instanceof TypeError?'Network or CORS error. Check the key, URL and connection.':e.message;
   if(/^429|quota|rate/i.test(last)){status(`Rate limit; waiting ${20*(a+1)}s. ${last.slice(0,80)}`);await sleep(20000*(a+1));continue}
   throw new Error(last)}
  await sleep(Math.max(0,+$('delay').value)*1000);
  try{return extractJson(text)}catch(_){last='The model did not return valid JSON.';user+='\n\nYour last reply was not valid JSON. Reply with ONLY the JSON object.'}
 }
 throw new Error(last||'Request failed.');
}

/* ---------- world state ---------- */
const okColor=c=>/^#[0-9a-f]{6}$/i.test(str(c))?c:null;
function addItem(kind,name,desc,shape,color,size,parts){
 const pts=Array.isArray(parts)?parts.filter(q=>q&&typeof q==='object').slice(0,40):[];
 const old=S.items.find(i=>i.name===name);
 if(old){if(!pts.length)return;Object.assign(old,{desc,parts:pts,color:okColor(color)||old.color,size:cl(size,old.size,.4,4)});NEW.push(old);return}
 const r=hs(name),i=S.items.length,ang=i*2.39996,rad=7+3.4*Math.sqrt(i);
 let x=Math.cos(ang)*rad,z=Math.sin(ang)*rad,y=2+hs(name+'y')*4;
 if(kind==='object'||kind==='faction'){x*=.65;z*=.65;y=hs(name+'y')*3}
 if(kind==='water'){x*=.7;z*=.7;y=.12}
 if(kind==='rule'||kind==='sun'){x=0;y=0;z=0}
 const it={name,kind,desc,parts:pts,shape:SH.includes(shape)?shape:SH[Math.floor(r*SH.length)],color:okColor(color)||'#'+new THREE.Color().setHSL(r,.6,.62).getHexString(),size:cl(size,1,.4,4),x,y,z,i};
 S.items.push(it);NEW.push(it);
}
function removeItem(name){S.items=S.items.filter(i=>i.name!==name);const n=nodes[name];if(n){if(sunNode===n)sunNode=null;scene.remove(n.g);delete nodes[name]}}
function registerSpecies(c){
 const diet=['producer','grazer','hunter','none'].includes(c.diet)?c.diet:'none',color=okColor(c.color)||'#7ccf8b';
 let parts=(Array.isArray(c.parts)?c.parts:[]).filter(q=>q&&typeof q==='object').slice(0,14);
 if(!parts.length)parts=diet==='producer'?[{s:'cylinder',p:[0,.4,0],sc:[.15,.8,.15],c:'#7a5230'},{s:'ico',p:[0,1,0],sc:[.9,.8,.9],c:color}]:[{s:'sphere',p:[0,.5,0],sc:[.9,.9,1.2],c:color},{s:'sphere',p:[0,.8,.6],sc:.5,c:color},{s:'sphere',p:[.15,.95,.9],sc:.12,c:'#ffffff'},{s:'sphere',p:[-.15,.95,.9],sc:.12,c:'#ffffff'}];
 S.species[c.name]={name:c.name,diet,speed:diet==='producer'?0:cl(c.speed,1.5,.3,4),life:cl(c.lifespan,240,40,900),alt:cl(c.alt,0,0,8),size:cl(c.size,1,.3,4),color,parts,max:diet==='producer'?40:24};
}
function applyCreations(act){
 (Array.isArray(act.creations)?act.creations:[]).slice(0,3).forEach(c=>{
  if(!c||!c.name)return;const kind=str(c.kind).toLowerCase(),name=str(c.name).slice(0,40);
  if(kind==='life'){registerSpecies(Object.assign({},c,{name}));NEW.push({kind:'life',name,count:Math.round(cl(c.count,4,1,12)),x:(Math.random()-.5)*30,y:0,z:(Math.random()-.5)*30,i:S.items.length});return}
  if(kind==='rule'){const e=name+': '+str(c.description);if(!S.rules.includes(e))S.rules.push(e);S.rules=S.rules.slice(-20)}
  if(kind==='sun')S.items.filter(i=>i.kind==='sun'&&i.name!==name).forEach(i=>removeItem(i.name));
  addItem(['place','object','water','sun','rule','faction'].includes(kind)?kind:'object',name,str(c.description),c.shape,c.color,c.size,c.parts)});
 (Array.isArray(act.remove)?act.remove:[]).slice(0,5).forEach(n=>{n=str(n);if(S.species[n]){delete S.species[n];IND.forEach(o=>{if(o.d.sp===n)o.dead=1});purge()}removeItem(n)});
}
function dayLabel(){return['Midday','Dusk','Night','Dawn'][Math.round(((time/150)%1)*4)%4]}
function report(){
 const c={},en={};IND.forEach(o=>{if(o.dead)return;const k=o.sp.name;c[k]=(c[k]||0)+1;en[k]=(en[k]||0)+o.d.e});
 const rep={sky:dayLabel(),world_age_seconds:Math.round(S.simTime),species:Object.values(S.species).map(sp=>({name:sp.name,diet:sp.diet,alive:c[sp.name]||0,extinct:!c[sp.name],avg_energy:c[sp.name]?Math.round(en[sp.name]/c[sp.name]):0,born:S.stats.born[sp.name]||0,starved:S.stats.starved[sp.name]||0,eaten:S.stats.eaten[sp.name]||0,died_of_age:S.stats.old[sp.name]||0})),things:S.items.map(i=>i.kind+': '+i.name).slice(-40)};
 S.hist=S.hist.concat([{tick:S.tick,alive:c}]).slice(-12);S.stats={born:{},starved:{},eaten:{},old:{}};return rep;
}
async function genesis(){
 status('Creating the world…');
 const g=await ask(P.genesis,{seed:$('seed').value||'surprise me'},3072),w=D(g.world),st=D(g.steward);
 S={tick:0,clock:'Dawn',world:{name:str(w.name)||'The Blue Void',premise:str(w.premise)},character:{name:str(st.name)||'Steward',personality:str(st.personality),purpose:str(st.purpose),values:L(st.values)},plan:L(g.plan),rules:[],items:[],species:{},pop:[],stats:{born:{},starved:{},eaten:{},old:{}},hist:[],longMemory:'',style:'',story:[],whispers:[],simTime:0};NEW=[];
 return{action:'The Steward opens its eyes over the empty cloud-land.',scene:S.world.premise+'\n\nPurpose: '+S.character.purpose,items:[]};
}
async function tick(){
 NEW=[];const n=S.tick+1;
 const ctx={tick:n,steward:S.character,world:S.world,laws:S.rules,plan:S.plan,report:report(),long_memory:S.longMemory,style_notes:S.style,recent_log:S.story.slice(-5).map(e=>e.log)};
 if(S.whispers.length){ctx.whisper_from_outside=S.whispers.join('\n');S.whispers=[]}
 status(`Tick ${n}: the Steward studies the world…`);
 const act=await ask(P.character,ctx,4096);applyCreations(act);
 if(L(act.plan).length)S.plan=L(act.plan).slice(0,5);
 S.tick=n;const e={tick:n,clock:dayLabel(),action:str(act.action),thought:str(act.reasoning),obs:str(act.observation),log:str(act.log)||str(act.action)};S.story.push(e);
 return Object.assign({items:NEW.slice(),scene:e.log},e);
}
async function reflect(){
 status('The Steward reflects…');
 const r=await ask(P.reflect,{steward:S.character,plan:S.plan,long_memory:S.longMemory,population_history:S.hist,recent_log:S.story.slice(-8).map(e=>({tick:e.tick,action:e.action,log:e.log})),style_notes:S.style},3072);
 S.longMemory=str(r.long_memory||S.longMemory).slice(0,3000);if(r.purpose)S.character.purpose=str(r.purpose).slice(0,400);
 const pl=L(r.plan);if(pl.length)S.plan=pl.slice(0,5);S.style=str(r.style_notes||S.style).slice(0,800);
}

/* ---------- 3D ---------- */
const T=THREE,ren=new T.WebGLRenderer({antialias:true}),scene=new T.Scene(),cam=new T.PerspectiveCamera(60,1,.1,420);
document.body.prepend(ren.domElement);ren.setPixelRatio(Math.min(2,devicePixelRatio));scene.fog=new T.FogExp2(0xa9dcff,.006);
const hemi=new T.HemisphereLight(0xffffff,0x6aa8ff,.95);scene.add(hemi);const sun=new T.DirectionalLight(0xffffff,.8);sun.position.set(10,20,8);scene.add(sun);
const LP=[];for(let i=0;i<6;i++){const l=new T.PointLight(0xffffff,0,28,1);scene.add(l);LP.push(l)}
const mat=(c,o)=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.55,metalness:.1,flatShading:true},o));
const U={top:{value:new T.Color()},bot:{value:new T.Color()}};
scene.add(new T.Mesh(new T.SphereGeometry(300,24,16),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,uniforms:U,vertexShader:'varying vec3 p;void main(){p=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'uniform vec3 top,bot;varying vec3 p;void main(){gl_FragColor=vec4(mix(bot,top,smoothstep(-.3,.7,p.y)),1.);}'})));
const PAL=[['#1457c7','#a9dcff'],['#3a2a80','#ff9e7a'],['#06122e','#27498c'],['#4b3a9a','#ffb88c'],['#1457c7','#a9dcff']],tB=new T.Color();
function puff(n,r,spread,y){const g=new T.Group();for(let i=0;i<n;i++){const m=new T.Mesh(new T.SphereGeometry(r*(.6+Math.random()*.6),12,8),mat('#ffffff',{flatShading:false,roughness:1}));m.position.set((Math.random()-.5)*spread,(Math.random()-.5)*y,(Math.random()-.5)*spread);m.scale.y=.55;g.add(m)}return g}
const base=puff(9,1.9,5,.4);scene.add(base);
const land=new T.Mesh(new T.CylinderGeometry(30,33,1,48),mat('#f4f9ff',{flatShading:false,roughness:1}));land.position.y=-.5;scene.add(land);
const clouds=[];for(let i=0;i<16;i++){const c=puff(4,2.4,6,1.5);c.position.set((Math.random()-.5)*130,-12+Math.random()*26,(Math.random()-.5)*130);c.scale.setScalar(1+Math.random()*1.5);scene.add(c);clouds.push(c)}
function label(t,w){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.font='600 26px system-ui,sans-serif';x.textAlign='center';x.fillStyle='rgba(255,255,255,.9)';
 const bw=Math.min(250,x.measureText(t).width+26);x.beginPath();if(x.roundRect)x.roundRect(128-bw/2,8,bw,48,24);else x.rect(128-bw/2,8,bw,48);x.fill();x.fillStyle='#0f2447';x.fillText(t.slice(0,22),128,43);
 const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true}));s.scale.set(w,w/4,1);return s}
function shapeMesh(s,c){const g=new T.Group(),m=mat(c);let a;
 if(s==='sphere')a=new T.Mesh(new T.SphereGeometry(.7,16,12),m);else if(s==='cube')a=new T.Mesh(new T.BoxGeometry(1.2,1.2,1.2),m);
 else if(s==='cone')a=new T.Mesh(new T.ConeGeometry(.7,1.6,12),m);else if(s==='torus')a=new T.Mesh(new T.TorusGeometry(.7,.25,10,20),m);
 else if(s==='crystal')a=new T.Mesh(new T.OctahedronGeometry(.95),m);else if(s==='cylinder')a=new T.Mesh(new T.CylinderGeometry(.5,.5,1.6,14),m);
 else if(s==='tree'){a=new T.Group();const t=new T.Mesh(new T.CylinderGeometry(.12,.18,1,8),mat('#7a5230')),k=new T.Mesh(new T.IcosahedronGeometry(.75,0),m);t.position.y=.5;k.position.y=1.5;a.add(t,k)}
 else{a=new T.Group();[1.2,.9,.6].forEach((w,i)=>{const b=new T.Mesh(new T.BoxGeometry(w,.8,w),m);b.position.y=.4+i*.8;a.add(b)})}
 g.add(a);return g}
const cl=(v,d,lo,hi)=>{v=Number(v);return Number.isFinite(v)?Math.min(hi,Math.max(lo,v)):d};
const GEO={sphere:()=>new T.SphereGeometry(.5,16,12),box:()=>new T.BoxGeometry(1,1,1),cone:()=>new T.ConeGeometry(.5,1,14),cylinder:()=>new T.CylinderGeometry(.5,.5,1,14),torus:()=>new T.TorusGeometry(.5,.15,10,24),octa:()=>new T.OctahedronGeometry(.5),ico:()=>new T.IcosahedronGeometry(.5,1),tetra:()=>new T.TetrahedronGeometry(.5),disc:()=>new T.CylinderGeometry(.5,.5,.06,20)};
const GC={},MC={};
const geo=s=>GC[s]||(GC[s]=(GEO[s]||GEO.sphere)());
const pmat=(c,g,a)=>{const k=c+(g?'g':'')+(a||'');return MC[k]||(MC[k]=new T.MeshStandardMaterial(Object.assign({color:c,roughness:.55,metalness:.1,flatShading:true},g?{emissive:c,emissiveIntensity:.7}:{},a?{transparent:true,opacity:a,depthWrite:false}:{})))};
function partsMesh(parts,dc){const g=new T.Group();g.userData.anims=[];g.userData.glow=null;
 parts.forEach((q,i)=>{const num=a=>Array.isArray(a)?a:[a],p=num(q.p),r=num(q.r),o=num(q.o),sc=num(q.sc);
  const col=okColor(q.c)||dc,al=cl(q.alpha,1,.05,1);if(q.glow&&!g.userData.glow)g.userData.glow=col;
  const w=cl(sc[0],1,.02,8),m=new T.Mesh(geo(q.s),pmat(col,!!q.glow,al<1?al:0)),pv=new T.Group();
  m.scale.set(w,cl(sc[1],w,.02,8),cl(sc[2],w,.02,8));m.position.set(cl(o[0],0,-8,8),cl(o[1],0,-8,8),cl(o[2],0,-8,8));
  pv.position.set(cl(p[0],0,-8,8),cl(p[1],0,-8,8),cl(p[2],0,-8,8));
  pv.rotation.set(cl(r[0],0,-720,720)*Math.PI/180,cl(r[1],0,-720,720)*Math.PI/180,cl(r[2],0,-720,720)*Math.PI/180);
  pv.add(m);g.add(pv);
  if(['flap','wag','spin','pulse','bob','wave'].includes(q.a)){pv.userData={a:q.a,rz:pv.rotation.z,ry:pv.rotation.y,y:pv.position.y,sg:pv.position.x>=0?1:-1,i};g.userData.anims.push(pv)}});
 return g}
function build(it){
 const g=new T.Group();let top,ly=3.4;g.userData={};
 let prt=it.parts&&it.parts.length?it.parts:[];
 if(!prt.length&&it.kind==='water')prt=[{s:'disc',p:[0,.1,0],sc:[8,1,8],c:it.color,alpha:.6,a:'wave'}];
 if(!prt.length&&it.kind==='sun')prt=[{s:'sphere',p:[0,0,0],sc:6,c:it.color||'#ffd34d',glow:1}];
 const T3=prt.length?partsMesh(prt,it.color):null;
 if(it.kind==='rule'){const r=new T.Mesh(new T.TorusGeometry(9+it.i*.9,.07,6,90),mat(it.color,{emissive:it.color,emissiveIntensity:.6,transparent:true,opacity:.55}));r.rotation.x=Math.PI/2;g.add(r);g.userData.spin=.05;g.userData.sc=1;return g}
 if(it.kind==='place'){const d=new T.Mesh(new T.CylinderGeometry(3,2.4,.8,18),mat(new T.Color(it.color).lerp(new T.Color('#ffffff'),.5))),rk=new T.Mesh(new T.ConeGeometry(2.4,2.8,10),mat('#8a93a6'));rk.rotation.x=Math.PI;rk.position.y=-1.8;top=T3||shapeMesh(it.shape,it.color);top.position.y=.4;if(!T3)top.scale.setScalar(1.3);g.add(d,rk,top);g.userData.bob=.25;ly=4.6}
 else if(it.kind==='sun'||it.kind==='water'){top=T3;g.add(top)}
 else if(it.kind==='faction'){if(T3){top=T3;g.add(top)}else{top=shapeMesh('tower',it.color);const f=new T.Mesh(new T.PlaneGeometry(1.2,.8),new T.MeshBasicMaterial({color:it.color,side:T.DoubleSide}));f.position.set(.7,3.3,0);g.add(top,f)}g.userData.bob=.1}
 else{top=T3||shapeMesh(it.shape,it.color);top.position.y=1.2;g.add(top);g.userData.spin=T3?.3:.6;g.userData.bob=.35}
 if(T3){g.updateMatrixWorld(true);ly=new T.Box3().setFromObject(g).max.y+.8;g.userData.glow=T3.userData.glow}
 g.userData.sc=it.size;g.userData.anims=T3?T3.userData.anims:[];g.position.set(it.x,it.y,it.z);
 const lb=label(it.name,3.4);lb.position.y=ly;g.add(lb);return g}
const nodes={},bursts=[],IND=[];let sunNode=null;
function spawn(it,anim){const old=nodes[it.name];if(old){if(!anim)return;scene.remove(old.g)}
 const g=build(it);if(old)g.position.copy(old.g.position);g.scale.setScalar(anim?.001:g.userData.sc);scene.add(g);
 nodes[it.name]={g,it,t:anim?0:1,wx:old?old.wx:it.x,wz:old?old.wz:it.z};if(it.kind==='sun')sunNode=nodes[it.name];
 if(anim)burst(new T.Vector3(g.position.x,g.position.y+1.5,g.position.z),it.color)}
function burst(p,c){const n=36,g=new T.BufferGeometry(),v=[];for(let i=0;i<n;i++)v.push(new T.Vector3(Math.random()-.5,Math.random()*.9,Math.random()-.5).normalize().multiplyScalar(2+Math.random()*3));
 g.setAttribute('position',new T.BufferAttribute(new Float32Array(n*3),3));const pt=new T.Points(g,new T.PointsMaterial({color:c,size:.4,transparent:true,depthWrite:false}));pt.position.copy(p);scene.add(pt);bursts.push({pt,v,t:0})}
/* living things (simulated locally, continuously) */
const rnd=(a,b)=>a+Math.random()*(b-a);
function clampR(d){const r=Math.hypot(d.x,d.z);if(r>27){d.x*=27/r;d.z*=27/r}}
function mkInd(d,anim){const sp=S.species[d.sp];if(!sp)return null;const g=partsMesh(sp.parts,sp.color);g.position.set(d.x,sp.alt,d.z);g.scale.setScalar(.001);scene.add(g);
 const o={d,g,sp,tx:d.x,tz:d.z,t:anim?0:1,cd:0,dead:0};IND.push(o);return o}
function populate(it){const sp=S.species[it.name];if(!sp)return;burst(new T.Vector3(it.x,1.5,it.z),sp.color);
 for(let k=0;k<it.count&&IND.length<90;k++){const d={sp:sp.name,x:it.x+rnd(-4,4),z:it.z+rnd(-4,4),e:70,age:0};clampR(d);S.pop.push(d);mkInd(d,true)}}
function kill(o,why){if(o.dead)return;o.dead=1;if(why){const m=S.stats[why];m[o.d.sp]=(m[o.d.sp]||0)+1}}
function purge(){for(let i=IND.length-1;i>=0;i--)if(IND[i].dead){scene.remove(IND[i].g);const j=S.pop.indexOf(IND[i].d);if(j>=0)S.pop.splice(j,1);IND.splice(i,1)}}
function step(dt){
 S.simTime+=dt;const day=Math.max(.15,Math.cos(time/150*6.2832)*.5+.5);
 const live=IND.filter(o=>!o.dead),cnt={};live.forEach(o=>cnt[o.sp.name]=(cnt[o.sp.name]||0)+1);
 const prod=live.filter(o=>o.sp.diet==='producer'),graz=live.filter(o=>o.sp.diet==='grazer');
 for(const o of live){const d=o.d,sp=o.sp;d.age+=dt;o.cd=Math.max(0,o.cd-dt);
  if(!S.species[sp.name]){o.dead=1;continue}
  if(d.age>sp.life){kill(o,'old');continue}
  const wander=()=>{if(Math.hypot(o.tx-d.x,o.tz-d.z)<1||Math.random()<.1){o.tx=d.x+rnd(-9,9);o.tz=d.z+rnd(-9,9)}};
  if(sp.diet==='producer')d.e=Math.min(100,d.e+1.8*day*dt);
  else if(sp.diet==='grazer'||sp.diet==='hunter'){const h=sp.diet==='hunter';d.e-=(h?1.3:1)*dt;
   let best=1e9,food=null;for(const f of(h?graz:prod)){if(f.dead)continue;const q=(f.d.x-d.x)**2+(f.d.z-d.z)**2;if(q<best){best=q;food=f}}
   if(food&&best<196){o.tx=food.d.x;o.tz=food.d.z;if(best<2&&!o.cd){o.cd=1;food.d.e-=h?100:35;d.e=Math.min(100,d.e+(h?50:30));if(food.d.e<=0)kill(food,'eaten')}}else wander()}
  else if(sp.speed>0)wander();
  if(d.e<=0){kill(o,'starved');continue}
  if(d.e>(sp.diet==='producer'?75:80)&&d.age>sp.life*.12&&cnt[sp.name]<sp.max&&IND.length<90&&Math.random()<.1){
   const pr=sp.diet==='producer'?2:1;d.e-=sp.diet==='producer'?30:35;
   const c={sp:sp.name,x:d.x+rnd(-3,3)*pr,z:d.z+rnd(-3,3)*pr,e:45,age:0};clampR(c);S.pop.push(c);mkInd(c,true);S.stats.born[sp.name]=(S.stats.born[sp.name]||0)+1}}
 purge();
}
function updPop(){const el=$('pop');if(!S){el.hidden=true;return}const c={};IND.forEach(o=>{if(!o.dead)c[o.sp.name]=(c[o.sp.name]||0)+1});
 const rows=Object.values(S.species).map(sp=>`${sp.name} (${sp.diet}): ${c[sp.name]||0}`);el.hidden=!rows.length;el.textContent=rows.length?'Life · '+dayLabel()+'\n'+rows.join('\n'):''}
setInterval(updPop,1000);
/* the character */
const ch=new T.Group(),rig=new T.Group();ch.add(rig);
function limb(x,y,len,c){const p=new T.Group();p.position.set(x,y,0);const m=new T.Mesh(new T.CylinderGeometry(.1,.1,len,6),mat(c));m.position.y=-len/2;p.add(m);return p}
const body=new T.Mesh(new T.CylinderGeometry(.35,.42,1.1,10),mat('#f4a261')),head=new T.Mesh(new T.SphereGeometry(.34,14,12),mat('#ffe3c2')),aL=limb(-.5,1.5,.9,'#f4a261'),aR=limb(.5,1.5,.9,'#f4a261'),lL=limb(-.2,.5,.9,'#34506b'),lR=limb(.2,.5,.9,'#34506b');
body.position.y=1;head.position.y=1.9;rig.add(body,head,aL,aR,lL,lR);ch.position.set(0,.9,0);scene.add(ch);
const C={tgt:null,res:null,gest:0,ph:0,idle:0,busy:false};let chLabel=null;
function setName(){if(chLabel)ch.remove(chLabel);chLabel=label(S?str(S.character.name):'',3.4);chLabel.position.y=2.9;ch.add(chLabel)}
function goTo(p){return new Promise(r=>{C.tgt=p.clone();C.res=r})}
function near(it){return new T.Vector3(it.x+Math.cos(it.i)*3.6,it.y+(it.kind==='place'?1.4:.9),it.z+Math.sin(it.i)*3.6)}
async function play(ev){
 C.busy=true;$('act').textContent=(S?S.character.name:'')+': '+ev.action;showScene(ev.scene);
 if(ev.items.length)for(const it of ev.items){await goTo(near(it));C.gest=1.1;await sleep(700);if(it.kind==='life')populate(it);else spawn(it,true);await sleep(700)}
 else{await goTo(new T.Vector3((Math.random()-.5)*14,.9+Math.random()*2,(Math.random()-.5)*14));await sleep(1200)}
 C.busy=false;
}
let Q=Promise.resolve(),qn=0;function enqueue(ev){qn++;Q=Q.then(()=>play(ev)).catch(()=>{}).then(()=>{qn--})}
/* camera */
const O={yaw:.6,pitch:.35,dist:22,f:new T.Vector3(0,2,0)},cv=ren.domElement;let lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{lx=e.clientX;ly=e.clientY});
cv.addEventListener('pointermove',e=>{if(e.buttons){O.yaw-=(e.clientX-lx)*.005;O.pitch=Math.max(-.2,Math.min(1.3,O.pitch+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY}});
cv.addEventListener('wheel',e=>{O.dist=Math.max(6,Math.min(90,O.dist*(1+e.deltaY*.001)))},{passive:true});
function resize(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
/* simulation */
let last=performance.now(),time=0,acc=0;
function anim(u,dt){if(u.anims)u.anims.forEach(pv=>{const d=pv.userData;
 if(d.a==='flap')pv.rotation.z=d.rz+d.sg*Math.sin(time*6+d.i)*.6;
 else if(d.a==='wag')pv.rotation.y=d.ry+Math.sin(time*4+d.i)*.45;
 else if(d.a==='spin')pv.rotation.y+=dt*2;
 else if(d.a==='pulse')pv.scale.setScalar(1+Math.sin(time*3+d.i)*.1);
 else if(d.a==='wave'){pv.position.y=d.y+Math.sin(time*1.5+d.i)*.05;pv.rotation.x=Math.sin(time*1.2+d.i)*.02;pv.rotation.z=Math.cos(time*1.1)*.02}
 else pv.position.y=d.y+Math.sin(time*2+d.i)*.15})}
function sim(dt){
 const ph=(time/150)%1,p=ph*4,i=Math.floor(p),f=p-i,h=Math.cos(ph*6.2832),dn=Math.max(.15,h*.5+.5);
 U.top.value.set(PAL[i][0]).lerp(tB.set(PAL[i+1][0]),f);U.bot.value.set(PAL[i][1]).lerp(tB.set(PAL[i+1][1]),f);scene.fog.color.copy(U.bot.value);
 hemi.intensity=.1+.95*dn;sun.intensity=.8*dn;const sx=Math.sin(ph*6.2832)*60,sy=h*45+4;sun.position.set(sx,Math.max(sy,2),-20);
 if(sunNode)sunNode.g.position.set(sx,sy,-45);
 let lk=0;for(const k in nodes){const n=nodes[k],gl=n.g.userData.glow;if(gl&&lk<6&&n.it.kind!=='sun'){const l=LP[lk++];l.color.set(gl);l.position.set(n.g.position.x,n.g.position.y+2,n.g.position.z);l.intensity=1.6}}
 for(;lk<6;lk++)LP[lk].intensity=0;
 acc+=dt;while(acc>=.5){acc-=.5;if(S&&IND.length)step(.5)}
 for(const o of IND){if(o.dead)continue;const g=o.g,d=o.d,sp=o.sp;if(o.t<1)o.t=Math.min(1,o.t+dt/1.2);
  g.scale.setScalar(Math.max(.001,sp.size*(.45+.55*Math.min(1,d.age/(sp.life*.2)))*o.t));
  if(sp.speed>0){const dx=o.tx-d.x,dz=o.tz-d.z,dd=Math.hypot(dx,dz);if(dd>.3){const v=sp.speed*(sp.diet==='hunter'?1.3:1)*dt;d.x+=dx/dd*v;d.z+=dz/dd*v;clampR(d);g.rotation.y=Math.atan2(dx,dz)}}
  g.position.set(d.x,sp.alt+(sp.alt>0?Math.sin(time*1.5+d.x)*.3:0),d.z);anim(g.userData,dt)}
 clouds.forEach(c=>{c.position.x+=.5*dt;if(c.position.x>70)c.position.x=-70});
 for(const k in nodes){const n=nodes[k],g=n.g,u=g.userData;
  if(n.t<1){n.t=Math.min(1,n.t+dt/1.1);const e=1+2.7*Math.pow(n.t-1,3)+1.7*Math.pow(n.t-1,2);g.scale.setScalar(Math.max(.001,u.sc*e))}
  if(u.spin)g.rotation.y+=u.spin*dt;
  anim(u,dt);
  if(u.wander){const dx=n.wx-g.position.x,dz=n.wz-g.position.z,d=Math.hypot(dx,dz);if(d<.5){n.wx=(Math.random()-.5)*26;n.wz=(Math.random()-.5)*26}else{g.position.x+=dx/d*1.3*dt;g.position.z+=dz/d*1.3*dt;g.rotation.y=Math.atan2(dx,dz)}}
  if(u.bob)g.position.y=n.it.y+Math.sin(time*1.3+n.it.i)*u.bob}
 for(let b=bursts.length-1;b>=0;b--){const o=bursts[b];o.t+=dt;const a=o.pt.geometry.attributes.position;o.v.forEach((v,j)=>a.setXYZ(j,v.x*o.t,v.y*o.t,v.z*o.t));a.needsUpdate=true;o.pt.material.opacity=Math.max(0,1-o.t/1.1);if(o.t>1.1){scene.remove(o.pt);bursts.splice(b,1)}}
 let moving=0;
 if(C.tgt){const d=C.tgt.clone().sub(ch.position),dist=d.length();if(dist<.5){C.tgt=null;const r=C.res;C.res=null;r&&r()}else{ch.position.addScaledVector(d.normalize(),Math.min(dist*1.2+2,9)*dt);ch.rotation.y=Math.atan2(d.x,d.z);moving=1}}
 else if(!C.busy&&!running&&false){}
 else if(!C.busy){C.idle+=dt;if(C.idle>4){C.idle=0;C.tgt=new T.Vector3((Math.random()-.5)*8,.9,(Math.random()-.5)*8);C.res=null}}
 C.ph+=dt*(moving?9:2);const sw=Math.sin(C.ph)*(moving?.7:.05);lL.rotation.x=sw;lR.rotation.x=-sw;
 const up=C.gest>0;C.gest=Math.max(0,C.gest-dt);const k=Math.min(1,dt*8);
 aL.rotation.z+=((up?-2.5:-.08)-aL.rotation.z)*k;aR.rotation.z+=((up?2.5:.08)-aR.rotation.z)*k;aL.rotation.x=aR.rotation.x=up?0:sw*.6;
 rig.position.y=Math.sin(time*2)*.08+(up?.25:0);
}
function frame(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;time+=dt;sim(dt);
 const fo=$('follow').checked?ch.position:new T.Vector3(0,2,0);O.f.lerp(fo,Math.min(1,dt*2));
 cam.position.set(O.f.x+O.dist*Math.cos(O.pitch)*Math.sin(O.yaw),O.f.y+O.dist*Math.sin(O.pitch),O.f.z+O.dist*Math.cos(O.pitch)*Math.cos(O.yaw));cam.lookAt(O.f);
 ren.render(scene,cam);requestAnimationFrame(frame)}

/* ---------- UI ---------- */
function showScene(t){$('scene').textContent=logOpen&&S?S.story.map(e=>`[${e.tick}] ${e.clock}\n${e.log}`).join('\n\n'):(t||'')}
function ui(){$('begin').disabled=running;$('begin').textContent=S?'Continue':'Begin';$('pause').disabled=!running}
async function run(){
 if(running)return;saveCfg();
 if($('provider').value==='gemini'&&!$('key').value.trim()){status('Paste a Gemini API key first (free at aistudio.google.com/app/apikey).',true);return}
 if($('provider').value==='openai'&&!$('base').value.trim()){status('Enter the Base URL for your provider.',true);return}
 running=true;ui();let n=0;
 try{
  if(!S){const ev=await genesis();saveState();setName();enqueue(ev)}
  while(running&&n<Math.max(1,+$('ticks').value)){
   while(qn>2&&running)await sleep(500);
   enqueue(await tick());if(S.tick%Math.max(1,+$('reflect').value)===0&&running)await reflect();
   saveState();n++}
  status(running?`Finished ${n} ticks. Press Continue to keep going.`:`Paused after ${n} ticks.`);
 }catch(e){status(e.message+' Progress is saved; press Continue to retry.',true)}
 running=false;saveState();ui();
}
$('begin').onclick=run;$('pause').onclick=()=>{running=false;status('Pausing after the current step…')};
$('logb').onclick=()=>{logOpen=!logOpen;showScene(S&&S.story.length?S.story[S.story.length-1].log:'')};
$('reset').onclick=()=>{if(!confirm('Delete this world and start over?'))return;running=false;try{localStorage.removeItem(K+':state')}catch(e){}location.reload()};
$('send').onclick=()=>{const t=$('whisper').value.trim();if(!S){status('Begin first, then whisper.',true);return}if(t){S.whispers.push(t);$('whisper').value='';saveState();status('Whisper queued for the next tick.')}};
$('provider').onchange=()=>{const o=$('provider').value==='openai';$('baserow').hidden=!o;if(o&&$('model').value==='gemini-3.5-flash-lite')$('model').value='';if(!o&&!$('model').value)$('model').value='gemini-3.5-flash-lite'};
F.forEach(f=>$(f).addEventListener('change',saveCfg));
loadCfg();try{S=JSON.parse(localStorage.getItem(K+':state')||'null')}catch(e){S=null}
$('provider').onchange();
if(S){S.items=S.items||[];S.species=S.species||{};S.pop=S.pop||[];S.stats=S.stats||{born:{},starved:{},eaten:{},old:{}};S.hist=S.hist||[];S.rules=S.rules||[];S.simTime=S.simTime||0;S.items.forEach(it=>spawn(it,false));S.pop=S.pop.filter(d=>mkInd(d,false)&&true);IND.forEach(o=>{o.t=1});setName();const l=S.story[S.story.length-1];if(l){$('act').textContent=S.character.name+': '+l.action;showScene(l.log)}}
ui();requestAnimationFrame(frame);
</script></body></html>
