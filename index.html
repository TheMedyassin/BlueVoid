<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Blue Void 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#4a9be8;font:14px/1.45 system-ui,sans-serif;color:#0f2447}
canvas{display:block;position:fixed;inset:0;touch-action:none}
.hud{position:fixed;z-index:2;background:rgba(251,253,255,.93);box-shadow:0 8px 30px rgba(10,40,100,.28)}
#menu{top:10px;left:10px;width:min(290px,calc(100vw - 20px));max-height:calc(100vh - 150px);overflow:auto;border-radius:20px 20px 20px 6px;padding:10px 14px}
summary{cursor:pointer;font:600 1.15rem Georgia,serif}
label{display:block;font-weight:600;font-size:12.5px;margin:9px 0 3px}
input,select,textarea{width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid #cfe0f5;border-radius:10px;font:inherit;color:inherit;background:#fff}
textarea{resize:vertical;min-height:70px}input[type=checkbox]{width:auto}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
button{font:inherit;font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid #0f2447;background:#fff;color:#0f2447;cursor:pointer}
button.go{background:#0f2447;color:#fff}button:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
:focus-visible{outline:3px solid #d9730d;outline-offset:2px}
#status{font-size:12.5px;color:#4b6188;margin-top:8px}#status.err{color:#b3261e;font-weight:600}
#cap{bottom:10px;left:50%;transform:translateX(-50%);width:min(780px,calc(100vw - 20px));box-sizing:border-box;border-radius:24px 24px 6px 24px;padding:10px 16px}
#act{font-weight:600;font-size:13px;color:#d9730d}
#scene{font:1.02rem/1.55 Georgia,serif;max-height:20vh;overflow:auto;white-space:pre-wrap;margin:2px 0 6px}
.wr{display:flex;gap:6px}.wr input{flex:1}
</style></head><body>
<div id="menu" class="hud"><details open><summary>The Blue Void</summary>
<label for="provider">AI provider</label>
<select id="provider"><option value="gemini">Gemini (free key)</option><option value="openai">OpenAI-compatible</option></select>
<label for="key">API key</label><input id="key" type="password" autocomplete="off" placeholder="Paste your key">
<div id="baserow" hidden><label for="base">Base URL</label><input id="base" placeholder="https://api.groq.com/openai/v1"></div>
<label for="model">Model</label><input id="model" value="gemini-3.5-flash-lite">
<label for="seed">Seed idea</label>
<textarea id="seed">A boundless blue void, like open sky with no ground and no horizon. A single platform shaped like a cloud floats in it, and the character begins there, alone. The character can create anything from nothing (places, beings, objects, rules, whole worlds) simply by willing it, and can reshape and expand the void. Tone: dreamlike, curious, wondrous.</textarea>
<label for="creator">Who may create new things</label>
<select id="creator"><option value="both">Character and world</option><option value="character">Only the character</option></select>
<div class="row"><div><label for="ticks">Ticks/run</label><input id="ticks" type="number" min="1" value="10"></div>
<div><label for="reflect">Reflect every</label><input id="reflect" type="number" min="1" value="5"></div>
<div><label for="delay">Pause (s)</label><input id="delay" type="number" min="0" value="7"></div></div>
<label><input type="checkbox" id="follow" checked> Camera follows the character</label>
<div class="btns"><button class="go" id="begin">Begin</button><button id="pause" disabled>Pause</button><button id="logb">Story log</button><button id="reset">New world</button></div>
<div id="status"></div><p style="font-size:12px;color:#4b6188;margin:8px 0 0">Drag to look around, scroll to zoom. Key and world are saved in this browser only.</p>
</details></div>
<div id="cap" class="hud"><div id="act"></div><div id="scene">Add a free key in the menu, then press Begin.</div>
<div class="wr"><input id="whisper" placeholder="Whisper to the character (arrives on the next tick)" aria-label="Whisper"><button id="send">Send</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),K='blue-void-3d-v1',sleep=ms=>new Promise(r=>setTimeout(r,ms));
const L=x=>Array.isArray(x)?x.map(String):[],D=x=>x&&typeof x==='object'&&!Array.isArray(x)?x:{},str=x=>x==null?'':String(x);
const hs=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0)/4294967295};
const F=['provider','key','model','base','seed','creator','ticks','reflect','delay'];
let S=null,running=false,NEW=[],logOpen=false;
const SH=['sphere','cube','cone','torus','crystal','cylinder','tree','tower'];
const P={
genesis:`You design fictional worlds and the characters who live in them. Given a seed, invent something specific, strange and consistent; avoid cliches. If the seed gives the character a power, make it central and describe how it feels to use it.
Reply with JSON only: {"world":{"name":"","premise":"","tone":"","rules":["3-5 rules"],"places":{"name":"desc"},"factions":{"name":"agenda"},"beings":{"name":"desc"},"objects":{"name":"desc"},"facts":[]},"character":{"name":"","concept":"","power":"","traits":[],"flaws":[],"desires":[],"fears":[],"secrets":[],"goals":["1-3 goals"],"relationships":{"name":"note"},"mood":"","memories":[]},"threads":["2-4 plotlines"],"clock":"starting time label"}`,
character:`You ARE the character on the sheet, living in a fictional world. You are not an assistant. Pursue your goals, be shaped by flaws and fears, change your mind. Never wait for instructions; avoid the obvious choice. If there is a 'whisper_from_outside', interpret it in-world. USE your power: bring things into existence from nothing (places, beings, objects, rules, factions) and expand the world on your own initiative. Be specific and surprising; build on what exists. Each creation also gets a look for the 3D view.
Reply with JSON only: {"inner_thought":"1-3 sentences","action":"what you do or say, concrete","intent":"","creations":[{"kind":"place|being|object|rule|faction","name":"short name","description":"","shape":"sphere|cube|cone|torus|crystal|cylinder|tree|tower","color":"#rrggbb","size":1}]} ('creations' holds 0-3 items; size is 0.5-3.)`,
world:`You are the world: narrator and simulator. Resolve the character's action honestly, including failure and side effects. Let beings and factions pursue their own agendas. Anything in 'creations' is now permanent canon: show it coming into being, then let it behave by its own nature; created beings have wills and may surprise or disobey their maker. Never deny the character's power, but the world can react. At most one complication per turn, keep continuity, vivid concrete prose (120-200 words), avoid repeating recent imagery, follow style_notes and creation_policy. Non-graphic.
Reply with JSON only: {"scene":"prose","time_advance":"new time label","world_changes":{"places":{"name":"desc"},"factions":{"name":"desc"},"facts":[]},"new_threads":[],"resolved_threads":[],"character_changes":{"mood":"","add_memories":[],"relationship_changes":{"name":"note"},"new_goals":[],"dropped_goals":[]}}`,
reflect:`You are the character, pausing to reflect, and an honest editor of your story. Compress what matters into long-term memory, decide what you now want, and critique the recent scenes: what is repetitive, and what should change?
Reply with JSON only: {"long_memory":"summary under 400 words","revised_goals":["1-4 goals"],"lesson":"","power":"how you now understand your ability, 1-2 sentences","style_notes":"2-4 concrete instructions for next scenes"}`};

/* ---------- storage + AI ---------- */
function status(m,e){const s=$('status');s.textContent=m||'';s.className=e?'err':''}
function saveCfg(){try{const c={};F.forEach(f=>c[f]=$(f).value);localStorage.setItem(K+':cfg',JSON.stringify(c))}catch(e){}}
function loadCfg(){try{const c=JSON.parse(localStorage.getItem(K+':cfg')||'{}');F.forEach(f=>{if(c[f]!==undefined)$(f).value=c[f]})}catch(e){}}
function saveState(){try{localStorage.setItem(K+':state',JSON.stringify(S))}catch(e){status('Could not save to browser storage.',true)}}
function extractJson(t){const m=t.match(/```(?:json)?\s*(\{[\s\S]*\})\s*```/);if(m)t=m[1];else{const i=t.indexOf('{'),j=t.lastIndexOf('}');if(i<0||j<0)throw 0;t=t.slice(i,j+1)}return JSON.parse(t)}
async function callModel(system,user,max){
 const key=$('key').value.trim(),model=$('model').value.trim();let r,j;
 if($('provider').value==='gemini'){
  r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:{maxOutputTokens:max,responseMimeType:'application/json'}})});
  j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status+': '+(j.error&&j.error.message||'request failed'));
  return((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('');
 }
 r=await fetch($('base').value.trim().replace(/\/$/,'')+'/chat/completions',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},key?{Authorization:'Bearer '+key}:{}),body:JSON.stringify({model,max_tokens:max,messages:[{role:'system',content:system},{role:'user',content:user}]})});
 j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status+': '+(j.error&&(j.error.message||j.error)||'request failed'));
 return j.choices?.[0]?.message?.content||'';
}
async function ask(system,payload,max){
 let user=JSON.stringify(payload),last='';
 for(let a=0;a<4;a++){
  let text;
  try{text=await callModel(system,user,max)}catch(e){
   last=e instanceof TypeError?'Network or CORS error. Check the key, URL and connection.':e.message;
   if(/^429|quota|rate/i.test(last)){status(`Rate limit; waiting ${20*(a+1)}s. ${last.slice(0,80)}`);await sleep(20000*(a+1));continue}
   throw new Error(last)}
  await sleep(Math.max(0,+$('delay').value)*1000);
  try{return extractJson(text)}catch(_){last='The model did not return valid JSON.';user+='\n\nYour last reply was not valid JSON. Reply with ONLY the JSON object.'}
 }
 throw new Error(last||'Request failed.');
}

/* ---------- world state ---------- */
const KEYS={place:'places',being:'beings',object:'objects',faction:'factions'};
function addItem(kind,name,desc,shape,color,size){
 if(S.items.some(i=>i.name===name))return;
 const r=hs(name),i=S.items.length,ang=i*2.39996,rad=7+3.4*Math.sqrt(i);
 let x=Math.cos(ang)*rad,z=Math.sin(ang)*rad,y=(hs(name+'y')-.5)*5;
 if(kind==='object'){x*=.65;z*=.65;y=1.5+hs(name+'y')*4}
 if(kind==='being'){x=(r-.5)*10;z=(hs(name+'z')-.5)*10;y=.3}
 if(kind==='rule'){x=0;y=0;z=0}
 const col=/^#[0-9a-f]{6}$/i.test(str(color))?color:'#'+new THREE.Color().setHSL(r,.6,.62).getHexString();
 const it={name,kind,desc,shape:SH.includes(shape)?shape:SH[Math.floor(r*SH.length)],color:col,size:Math.min(3,Math.max(.5,+size||1)),x,y,z,i};
 S.items.push(it);NEW.push(it);
}
function cap(o,n){const k=Object.keys(o);while(k.length>n)delete o[k.shift()]}
function applyCreations(act){
 const w=S.world;
 (Array.isArray(act.creations)?act.creations:[]).slice(0,3).forEach(c=>{
  if(!c||!c.name)return;const kind=str(c.kind).toLowerCase(),name=str(c.name).slice(0,40),desc=str(c.description);
  if(kind==='rule'){const e=name+': '+desc;if(!w.rules.includes(e))w.rules.push(e);w.rules=w.rules.slice(-20)}
  else{const k=KEYS[kind]||'objects';w[k]=D(w[k]);w[k][name]=desc;cap(w[k],30)}
  addItem(KEYS[kind]||kind==='rule'?kind:'object',name,desc,c.shape,c.color,c.size)});
}
function applyChanges(res){
 const w=S.world,c=S.character,wc=D(res.world_changes),cc=D(res.character_changes);
 if($('creator').value==='both')[['places','place'],['factions','faction']].forEach(([k,kd])=>{w[k]=D(w[k]);Object.entries(D(wc[k])).forEach(([a,b])=>{w[k][a]=str(b);addItem(kd,a.slice(0,40),str(b))})});
 w.facts=L(w.facts).concat(L(wc.facts)).slice(-40);
 if(cc.mood)c.mood=str(cc.mood);
 c.memories=L(c.memories).concat(L(cc.add_memories)).slice(-25);
 Object.entries(D(cc.relationship_changes)).forEach(([a,b])=>c.relationships[a]=str(b));
 const dg=L(cc.dropped_goals).map(s=>s.toLowerCase());
 c.goals=L(c.goals).filter(g=>!dg.some(d=>d.includes(g.toLowerCase())||g.toLowerCase().includes(d))).concat(L(cc.new_goals)).slice(-6);
 const rs=L(res.resolved_threads).map(s=>s.toLowerCase());
 S.threads=L(S.threads).filter(t=>!rs.some(r=>r.includes(t.toLowerCase())||t.toLowerCase().includes(r))).concat(L(res.new_threads)).slice(-12);
 if(res.time_advance)S.clock=str(res.time_advance);
}
async function genesis(){
 status('Creating the world…');
 const g=await ask(P.genesis,{seed:$('seed').value||'surprise me'},4096),w=D(g.world),c=D(g.character);
 ['places','factions','beings','objects'].forEach(k=>w[k]=D(w[k]));w.facts=L(w.facts);w.rules=L(w.rules);
 ['goals','memories','traits','flaws','desires','fears','secrets'].forEach(k=>c[k]=L(c[k]));c.relationships=D(c.relationships);
 S={tick:0,clock:str(g.clock)||'Start',world:w,character:c,threads:L(g.threads),longMemory:'',style:'',story:[],whispers:[],items:[]};NEW=[];
 [['places','place'],['beings','being'],['objects','object'],['factions','faction']].forEach(([k,kd])=>Object.entries(w[k]).forEach(([a,b])=>addItem(kd,a.slice(0,40),str(b))));
 return{action:'The world takes shape around '+(c.name||'the character')+'.',scene:str(w.premise),items:NEW.slice()};
}
async function tick(){
 NEW=[];const n=S.tick+1,recent=S.story.slice(-4).map(e=>({tick:e.tick,clock:e.clock,action:e.action,scene:e.scene.slice(0,1000)}));
 const ctx={tick:n,clock:S.clock,world:S.world,open_threads:S.threads,long_memory:S.longMemory,recent_scenes:recent,your_sheet:S.character};
 if(S.whispers.length){ctx.whisper_from_outside=S.whispers.join('\n');S.whispers=[]}
 status(`Tick ${n}: the character decides…`);
 const act=await ask(P.character,ctx,2048);applyCreations(act);
 status(`Tick ${n}: the world responds…`);
 const res=await ask(P.world,{tick:n,clock:S.clock,world:S.world,open_threads:S.threads,character_sheet:S.character,character_action:act,recent_scenes:recent,style_notes:S.style,
  creation_policy:$('creator').value==='both'?'You may add places, factions and complications of your own.':'ONLY the character creates. Do NOT invent new places, factions, beings or objects. Narrate, react, and let EXISTING beings and factions act and resist. Complications must come from what already exists.'},4096);
 applyChanges(res);S.tick=n;
 const e={tick:n,clock:S.clock,action:str(act.action),thought:str(act.inner_thought),scene:str(res.scene).trim()};S.story.push(e);
 return Object.assign({items:NEW.slice()},e);
}
async function reflect(){
 status('The character reflects…');
 const r=await ask(P.reflect,{character:S.character,long_memory:S.longMemory,recent_scenes:S.story.slice(-8).map(e=>({clock:e.clock,action:e.action,scene:e.scene.slice(0,800)})),open_threads:S.threads,style_notes:S.style},3072);
 S.longMemory=str(r.long_memory||S.longMemory).slice(0,3000);S.character.memories=[];
 const g=L(r.revised_goals);if(g.length)S.character.goals=g.slice(0,6);
 S.style=str(r.style_notes||S.style).slice(0,800);if(r.power)S.character.power=str(r.power).slice(0,600);
}

/* ---------- 3D ---------- */
const T=THREE,ren=new T.WebGLRenderer({antialias:true}),scene=new T.Scene(),cam=new T.PerspectiveCamera(60,1,.1,420);
document.body.prepend(ren.domElement);ren.setPixelRatio(Math.min(2,devicePixelRatio));scene.fog=new T.FogExp2(0xa9dcff,.006);
scene.add(new T.HemisphereLight(0xffffff,0x6aa8ff,.95));const sun=new T.DirectionalLight(0xffffff,.8);sun.position.set(10,20,8);scene.add(sun);
const mat=(c,o)=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.55,metalness:.1,flatShading:true},o));
const U={top:{value:new T.Color()},bot:{value:new T.Color()}};
scene.add(new T.Mesh(new T.SphereGeometry(300,24,16),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,uniforms:U,vertexShader:'varying vec3 p;void main(){p=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'uniform vec3 top,bot;varying vec3 p;void main(){gl_FragColor=vec4(mix(bot,top,smoothstep(-.3,.7,p.y)),1.);}'})));
const PAL=[['#1457c7','#a9dcff'],['#3a2a80','#ff9e7a'],['#06122e','#27498c'],['#1457c7','#a9dcff']],tB=new T.Color();
function puff(n,r,spread,y){const g=new T.Group();for(let i=0;i<n;i++){const m=new T.Mesh(new T.SphereGeometry(r*(.6+Math.random()*.6),12,8),mat('#ffffff',{flatShading:false,roughness:1}));m.position.set((Math.random()-.5)*spread,(Math.random()-.5)*y,(Math.random()-.5)*spread);m.scale.y=.55;g.add(m)}return g}
const base=puff(9,1.9,5,.4);scene.add(base);
const clouds=[];for(let i=0;i<16;i++){const c=puff(4,2.4,6,1.5);c.position.set((Math.random()-.5)*130,-12+Math.random()*26,(Math.random()-.5)*130);c.scale.setScalar(1+Math.random()*1.5);scene.add(c);clouds.push(c)}
function label(t,w){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.font='600 26px system-ui,sans-serif';x.textAlign='center';x.fillStyle='rgba(255,255,255,.9)';
 const bw=Math.min(250,x.measureText(t).width+26);x.beginPath();if(x.roundRect)x.roundRect(128-bw/2,8,bw,48,24);else x.rect(128-bw/2,8,bw,48);x.fill();x.fillStyle='#0f2447';x.fillText(t.slice(0,22),128,43);
 const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true}));s.scale.set(w,w/4,1);return s}
function shapeMesh(s,c){const g=new T.Group(),m=mat(c);let a;
 if(s==='sphere')a=new T.Mesh(new T.SphereGeometry(.7,16,12),m);else if(s==='cube')a=new T.Mesh(new T.BoxGeometry(1.2,1.2,1.2),m);
 else if(s==='cone')a=new T.Mesh(new T.ConeGeometry(.7,1.6,12),m);else if(s==='torus')a=new T.Mesh(new T.TorusGeometry(.7,.25,10,20),m);
 else if(s==='crystal')a=new T.Mesh(new T.OctahedronGeometry(.95),m);else if(s==='cylinder')a=new T.Mesh(new T.CylinderGeometry(.5,.5,1.6,14),m);
 else if(s==='tree'){a=new T.Group();const t=new T.Mesh(new T.CylinderGeometry(.12,.18,1,8),mat('#7a5230')),k=new T.Mesh(new T.IcosahedronGeometry(.75,0),m);t.position.y=.5;k.position.y=1.5;a.add(t,k)}
 else{a=new T.Group();[1.2,.9,.6].forEach((w,i)=>{const b=new T.Mesh(new T.BoxGeometry(w,.8,w),m);b.position.y=.4+i*.8;a.add(b)})}
 g.add(a);return g}
function build(it){
 const g=new T.Group();let top;g.userData={};
 if(it.kind==='rule'){const r=new T.Mesh(new T.TorusGeometry(9+it.i*.9,.07,6,90),mat(it.color,{emissive:it.color,emissiveIntensity:.6,transparent:true,opacity:.55}));r.rotation.x=Math.PI/2;g.add(r);g.userData.spin=.05;g.userData.sc=1;return g}
 if(it.kind==='place'){const d=new T.Mesh(new T.CylinderGeometry(3,2.4,.8,18),mat(new T.Color(it.color).lerp(new T.Color('#ffffff'),.5))),rk=new T.Mesh(new T.ConeGeometry(2.4,2.8,10),mat('#8a93a6'));rk.rotation.x=Math.PI;rk.position.y=-1.8;top=shapeMesh(it.shape,it.color);top.position.y=.4;top.scale.setScalar(1.3);g.add(d,rk,top);g.userData.bob=.25}
 else if(it.kind==='being'){top=shapeMesh(it.shape,it.color);top.position.y=.9;[-.25,.25].forEach(x=>{const e=new T.Mesh(new T.SphereGeometry(.12,8,8),mat('#ffffff',{emissive:'#ffffff',emissiveIntensity:.5}));e.position.set(x,1.3,.55);top.add(e)});g.add(top);g.userData.wander=1;g.userData.bob=.12}
 else if(it.kind==='faction'){top=shapeMesh('tower',it.color);const f=new T.Mesh(new T.PlaneGeometry(1.2,.8),new T.MeshBasicMaterial({color:it.color,side:T.DoubleSide}));f.position.set(.7,3.3,0);g.add(top,f);g.userData.bob=.1}
 else{top=shapeMesh(it.shape,it.color);top.position.y=1.2;g.add(top);g.userData.spin=.6;g.userData.bob=.35}
 g.userData.sc=it.size;g.position.set(it.x,it.y,it.z);
 const lb=label(it.name,3.4);lb.position.y=it.kind==='place'?4.6:3.4;g.add(lb);return g}
const nodes={},bursts=[];
function spawn(it,anim){if(nodes[it.name])return;const g=build(it);g.scale.setScalar(anim?.001:g.userData.sc);scene.add(g);nodes[it.name]={g,it,t:anim?0:1,wx:it.x,wz:it.z};
 if(anim)burst(new T.Vector3(it.x,it.y+1.5,it.z),it.color)}
function burst(p,c){const n=36,g=new T.BufferGeometry(),v=[];for(let i=0;i<n;i++)v.push(new T.Vector3(Math.random()-.5,Math.random()*.9,Math.random()-.5).normalize().multiplyScalar(2+Math.random()*3));
 g.setAttribute('position',new T.BufferAttribute(new Float32Array(n*3),3));const pt=new T.Points(g,new T.PointsMaterial({color:c,size:.4,transparent:true,depthWrite:false}));pt.position.copy(p);scene.add(pt);bursts.push({pt,v,t:0})}
/* the character */
const ch=new T.Group(),rig=new T.Group();ch.add(rig);
function limb(x,y,len,c){const p=new T.Group();p.position.set(x,y,0);const m=new T.Mesh(new T.CylinderGeometry(.1,.1,len,6),mat(c));m.position.y=-len/2;p.add(m);return p}
const body=new T.Mesh(new T.CylinderGeometry(.35,.42,1.1,10),mat('#f4a261')),head=new T.Mesh(new T.SphereGeometry(.34,14,12),mat('#ffe3c2')),aL=limb(-.5,1.5,.9,'#f4a261'),aR=limb(.5,1.5,.9,'#f4a261'),lL=limb(-.2,.5,.9,'#34506b'),lR=limb(.2,.5,.9,'#34506b');
body.position.y=1;head.position.y=1.9;rig.add(body,head,aL,aR,lL,lR);ch.position.set(0,.9,0);scene.add(ch);
const C={tgt:null,res:null,gest:0,ph:0,idle:0,busy:false};let chLabel=null;
function setName(){if(chLabel)ch.remove(chLabel);chLabel=label(S?str(S.character.name):'',3.4);chLabel.position.y=2.9;ch.add(chLabel)}
function goTo(p){return new Promise(r=>{C.tgt=p.clone();C.res=r})}
function near(it){return new T.Vector3(it.x+Math.cos(it.i)*3.6,it.y+(it.kind==='place'?1.4:.9),it.z+Math.sin(it.i)*3.6)}
async function play(ev){
 C.busy=true;$('act').textContent=(S?S.character.name:'')+': '+ev.action;showScene(ev.scene);
 if(ev.items.length)for(const it of ev.items){await goTo(near(it));C.gest=1.1;await sleep(700);spawn(it,true);await sleep(700)}
 else{await goTo(new T.Vector3((Math.random()-.5)*14,.9+Math.random()*2,(Math.random()-.5)*14));await sleep(1200)}
 C.busy=false;
}
let Q=Promise.resolve(),qn=0;function enqueue(ev){qn++;Q=Q.then(()=>play(ev)).catch(()=>{}).then(()=>{qn--})}
/* camera */
const O={yaw:.6,pitch:.35,dist:22,f:new T.Vector3(0,2,0)},cv=ren.domElement;let lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{lx=e.clientX;ly=e.clientY});
cv.addEventListener('pointermove',e=>{if(e.buttons){O.yaw-=(e.clientX-lx)*.005;O.pitch=Math.max(-.2,Math.min(1.3,O.pitch+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY}});
cv.addEventListener('wheel',e=>{O.dist=Math.max(6,Math.min(90,O.dist*(1+e.deltaY*.001)))},{passive:true});
function resize(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
/* simulation */
let last=performance.now(),time=0;
function sim(dt){
 const p=(time/150)%1*3,i=Math.floor(p),f=p-i;U.top.value.set(PAL[i][0]).lerp(tB.set(PAL[i+1][0]),f);U.bot.value.set(PAL[i][1]).lerp(tB.set(PAL[i+1][1]),f);scene.fog.color.copy(U.bot.value);
 clouds.forEach(c=>{c.position.x+=.5*dt;if(c.position.x>70)c.position.x=-70});
 for(const k in nodes){const n=nodes[k],g=n.g,u=g.userData;
  if(n.t<1){n.t=Math.min(1,n.t+dt/1.1);const e=1+2.7*Math.pow(n.t-1,3)+1.7*Math.pow(n.t-1,2);g.scale.setScalar(Math.max(.001,u.sc*e))}
  if(u.spin)g.rotation.y+=u.spin*dt;
  if(u.wander){const dx=n.wx-g.position.x,dz=n.wz-g.position.z,d=Math.hypot(dx,dz);if(d<.5){n.wx=(Math.random()-.5)*26;n.wz=(Math.random()-.5)*26}else{g.position.x+=dx/d*1.3*dt;g.position.z+=dz/d*1.3*dt;g.rotation.y=Math.atan2(dx,dz)}}
  if(u.bob)g.position.y=n.it.y+Math.sin(time*1.3+n.it.i)*u.bob}
 for(let b=bursts.length-1;b>=0;b--){const o=bursts[b];o.t+=dt;const a=o.pt.geometry.attributes.position;o.v.forEach((v,j)=>a.setXYZ(j,v.x*o.t,v.y*o.t,v.z*o.t));a.needsUpdate=true;o.pt.material.opacity=Math.max(0,1-o.t/1.1);if(o.t>1.1){scene.remove(o.pt);bursts.splice(b,1)}}
 let moving=0;
 if(C.tgt){const d=C.tgt.clone().sub(ch.position),dist=d.length();if(dist<.5){C.tgt=null;const r=C.res;C.res=null;r&&r()}else{ch.position.addScaledVector(d.normalize(),Math.min(dist*1.2+2,9)*dt);ch.rotation.y=Math.atan2(d.x,d.z);moving=1}}
 else if(!C.busy&&!running&&false){}
 else if(!C.busy){C.idle+=dt;if(C.idle>4){C.idle=0;C.tgt=new T.Vector3((Math.random()-.5)*8,.9,(Math.random()-.5)*8);C.res=null}}
 C.ph+=dt*(moving?9:2);const sw=Math.sin(C.ph)*(moving?.7:.05);lL.rotation.x=sw;lR.rotation.x=-sw;
 const up=C.gest>0;C.gest=Math.max(0,C.gest-dt);const k=Math.min(1,dt*8);
 aL.rotation.z+=((up?-2.5:-.08)-aL.rotation.z)*k;aR.rotation.z+=((up?2.5:.08)-aR.rotation.z)*k;aL.rotation.x=aR.rotation.x=up?0:sw*.6;
 rig.position.y=Math.sin(time*2)*.08+(up?.25:0);
}
function frame(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;time+=dt;sim(dt);
 const fo=$('follow').checked?ch.position:new T.Vector3(0,2,0);O.f.lerp(fo,Math.min(1,dt*2));
 cam.position.set(O.f.x+O.dist*Math.cos(O.pitch)*Math.sin(O.yaw),O.f.y+O.dist*Math.sin(O.pitch),O.f.z+O.dist*Math.cos(O.pitch)*Math.cos(O.yaw));cam.lookAt(O.f);
 ren.render(scene,cam);requestAnimationFrame(frame)}

/* ---------- UI ---------- */
function showScene(t){$('scene').textContent=logOpen&&S?S.story.map(e=>`[${e.tick}] ${e.clock}\n${e.scene}`).join('\n\n'):(t||'')}
function ui(){$('begin').disabled=running;$('begin').textContent=S?'Continue':'Begin';$('pause').disabled=!running}
async function run(){
 if(running)return;saveCfg();
 if($('provider').value==='gemini'&&!$('key').value.trim()){status('Paste a Gemini API key first (free at aistudio.google.com/app/apikey).',true);return}
 if($('provider').value==='openai'&&!$('base').value.trim()){status('Enter the Base URL for your provider.',true);return}
 running=true;ui();let n=0;
 try{
  if(!S){const ev=await genesis();saveState();setName();enqueue(ev)}
  while(running&&n<Math.max(1,+$('ticks').value)){
   while(qn>2&&running)await sleep(500);
   enqueue(await tick());if(S.tick%Math.max(1,+$('reflect').value)===0&&running)await reflect();
   saveState();n++}
  status(running?`Finished ${n} ticks. Press Continue to keep going.`:`Paused after ${n} ticks.`);
 }catch(e){status(e.message+' Progress is saved; press Continue to retry.',true)}
 running=false;saveState();ui();
}
$('begin').onclick=run;$('pause').onclick=()=>{running=false;status('Pausing after the current step…')};
$('logb').onclick=()=>{logOpen=!logOpen;showScene(S&&S.story.length?S.story[S.story.length-1].scene:'')};
$('reset').onclick=()=>{if(!confirm('Delete this world and start over?'))return;running=false;try{localStorage.removeItem(K+':state')}catch(e){}location.reload()};
$('send').onclick=()=>{const t=$('whisper').value.trim();if(!S){status('Begin first, then whisper.',true);return}if(t){S.whispers.push(t);$('whisper').value='';saveState();status('Whisper queued for the next tick.')}};
$('provider').onchange=()=>{const o=$('provider').value==='openai';$('baserow').hidden=!o;if(o&&$('model').value==='gemini-3.5-flash-lite')$('model').value='';if(!o&&!$('model').value)$('model').value='gemini-3.5-flash-lite'};
F.forEach(f=>$(f).addEventListener('change',saveCfg));
loadCfg();try{S=JSON.parse(localStorage.getItem(K+':state')||'null')}catch(e){S=null}
$('provider').onchange();
if(S){S.items=S.items||[];S.items.forEach(it=>spawn(it,false));setName();const l=S.story[S.story.length-1];if(l){$('act').textContent=S.character.name+': '+l.action;showScene(l.scene)}}
ui();requestAnimationFrame(frame);
</script></body></html>
