<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Blue Void</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f2447;--mute:#4b6188;--line:#cfe0f5;--cloud:#fbfdff;--sun:#d9730d;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.5 "Instrument Sans",system-ui,sans-serif;background:linear-gradient(180deg,#1457c7 0%,#4a9be8 45%,#a9dcff 100%) fixed}
header{max-width:1400px;margin:0 auto;padding:28px 16px 4px;color:#fff}
h1{font:600 2.4rem/1.1 Newsreader,Georgia,serif;margin:0}
header p{margin:6px 0 0;opacity:.9;max-width:60ch}
.app{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:16px;max-width:1400px;margin:0 auto;padding:16px}
.panel{background:rgba(251,253,255,.92);border-radius:22px 22px 22px 6px;padding:18px;box-shadow:0 10px 40px rgba(10,40,100,.25)}
.story{background:var(--cloud);border-radius:34px 34px 34px 8px;padding:26px 30px;min-height:70vh}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;color:inherit;background:#fff}
textarea{resize:vertical;min-height:84px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{font:inherit;font-weight:600;padding:9px 14px;border-radius:999px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
button.go{background:var(--ink);color:#fff}button:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
small,.hint{color:var(--mute);font-size:12.5px}
#status{min-height:1.4em;color:var(--mute);font-size:13.5px}#status.err{color:var(--bad);font-weight:600}
.story h2{font:600 1.9rem/1.15 Newsreader,Georgia,serif;margin:0}
.prem{font:italic 1.05rem/1.5 Newsreader,Georgia,serif;color:var(--mute);margin:4px 0 8px}
.scene{border-top:1px solid var(--line);padding:14px 0 6px}
.scene h3{font:600 .95rem/1.3 "Instrument Sans",sans-serif;margin:0 0 6px;color:var(--mute)}
.prose{font:1.12rem/1.65 Newsreader,Georgia,serif;margin:0 0 8px;max-width:68ch;white-space:pre-wrap}
.thought{font:italic 1rem/1.5 Newsreader,Georgia,serif;color:var(--mute);margin:0 0 6px}
.made{color:var(--sun);font-weight:600;font-size:13.5px;margin:0 0 6px}
.empty{color:var(--mute);font-size:1.05rem}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:600}
dt{font-weight:600;margin-top:6px}dd{margin:0;color:var(--mute);font-size:13.5px}
.me h3{margin:0;font:600 1.25rem Newsreader,Georgia,serif}.me p{margin:4px 0;font-size:13.5px}
@media(max-width:1000px){.app{grid-template-columns:1fr}.story{order:-1;padding:20px}}
</style></head><body>
<header><h1>The Blue Void</h1><p>One character on a cloud, in open sky, with the power to create anything. Press Begin and watch the world grow.</p></header>
<main class="app">
<section class="panel" aria-label="Settings">
 <label for="provider">AI provider</label>
 <select id="provider"><option value="gemini">Gemini (free key)</option><option value="openai">OpenAI-compatible (Groq, OpenRouter, Ollama…)</option></select>
 <label for="key">API key</label><input id="key" type="password" autocomplete="off" placeholder="Paste your key">
 <small id="keyhelp">Free key: aistudio.google.com/app/apikey</small>
 <div id="baserow" hidden><label for="base">Base URL</label><input id="base" placeholder="https://api.groq.com/openai/v1"></div>
 <label for="model">Model</label><input id="model" value="gemini-2.5-flash">
 <label for="seed">Seed idea</label>
 <textarea id="seed">A boundless blue void, like open sky with no ground and no horizon. A single platform shaped like a cloud floats in it, and the character begins there, alone. The character can create anything from nothing (places, beings, objects, rules, whole worlds) simply by willing it, and can reshape and expand the void. Tone: dreamlike, curious, wondrous.</textarea>
 <label for="creator">Who may create new things</label>
 <select id="creator"><option value="both">Character and world</option><option value="character">Only the character</option></select>
 <div class="row"><div><label for="ticks">Ticks per run</label><input id="ticks" type="number" min="1" value="10"></div>
 <div><label for="reflect">Reflect every</label><input id="reflect" type="number" min="1" value="5"></div>
 <div><label for="delay">Pause (s)</label><input id="delay" type="number" min="0" value="7"></div></div>
 <div class="btns"><button class="go" id="begin">Begin</button><button id="pause" disabled>Pause</button><button id="reset">New world</button></div>
 <div class="btns"><button id="exp">Export state</button><button id="imp">Import</button><button id="md">Story .md</button></div>
 <input id="file" type="file" accept="application/json" hidden>
 <p class="hint">Your key and the story are stored only in this browser. Free tiers have rate limits, so the pause keeps it under them.</p>
</section>
<section class="panel story" aria-live="polite"><div id="status"></div><div id="feed"></div></section>
<aside class="panel" aria-label="World state"><div id="side"></div>
 <label for="whisper">Whisper to the character</label>
 <textarea id="whisper" placeholder="A rumor, a dream, a letter… it arrives on the next tick."></textarea>
 <div class="btns"><button id="send">Send</button></div>
</aside>
</main>
<script>
const $=id=>document.getElementById(id),K='blue-void-v1',sleep=ms=>new Promise(r=>setTimeout(r,ms));
const L=x=>Array.isArray(x)?x.map(String):[],D=x=>x&&typeof x==='object'&&!Array.isArray(x)?x:{},str=x=>x==null?'':String(x);
const F=['provider','key','model','base','seed','creator','ticks','reflect','delay'];
let S=null,running=false;
const P={
genesis:`You design fictional worlds and the characters who live in them. Given a seed, invent something specific, strange and internally consistent; avoid cliches. The character is a person with contradictions. If the seed gives the character a power, make it central, specific and unlimited in what it can bring into being, and describe how it feels to use it.
Reply with JSON only: {"world":{"name":"","premise":"","tone":"","rules":["3-5 rules"],"places":{"name":"desc"},"factions":{"name":"agenda"},"beings":{"name":"desc"},"objects":{"name":"desc"},"facts":[]},"character":{"name":"","concept":"","power":"","traits":[],"flaws":[],"desires":[],"fears":[],"secrets":[],"goals":["1-3 goals"],"relationships":{"name":"note"},"mood":"","memories":[]},"threads":["2-4 open plotlines"],"clock":"starting time label"}`,
character:`You ARE the character on the sheet, living inside a fictional world. You are not an assistant. Pursue your goals, be shaped by your flaws and fears, hold grudges, change your mind. Never wait for instructions; avoid the obvious choice. If there is a 'whisper_from_outside', interpret it in-world. If your sheet has a power, USE it: you can bring things into existence from nothing (places, beings, objects, rules, factions) and expand the world on your own initiative. Be specific and surprising, and build on what exists.
Reply with JSON only: {"inner_thought":"1-3 sentences","action":"what you do or say, concrete","intent":"","creations":[{"kind":"place|being|object|rule|faction","name":"","description":""}]} ('creations' holds 0-3 items, or an empty list.)`,
world:`You are the world: narrator and simulator. Resolve the character's action honestly, including failure and side effects. Let other beings and factions pursue their own agendas. Anything in 'creations' is now permanent canon: show it coming into being, then let it behave by its own nature; created beings have wills and may surprise or disobey their maker. Never deny the character's power, but the world can react. Add at most one complication per turn, keep continuity, write vivid concrete prose (150-250 words), avoid repeating recent imagery, follow style_notes and creation_policy. Keep content non-graphic.
Reply with JSON only: {"scene":"prose","time_advance":"new time label","world_changes":{"places":{"name":"desc"},"factions":{"name":"desc"},"facts":[]},"new_threads":[],"resolved_threads":[],"character_changes":{"mood":"","add_memories":[],"relationship_changes":{"name":"note"},"new_goals":[],"dropped_goals":[]}}`,
reflect:`You are the character, pausing to reflect, and an honest editor of your own story. Compress what matters into long-term memory, decide what you now want, and critique the recent scenes: what is repetitive or predictable, and what should change?
Reply with JSON only: {"long_memory":"summary under 400 words","revised_goals":["1-4 goals"],"lesson":"","power":"how you now understand your ability, 1-2 sentences","style_notes":"2-4 concrete instructions for the next scenes"}`};

function h(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function status(m,err){const s=$('status');s.textContent=m||'';s.className=err?'err':''}
function saveCfg(){try{const c={};F.forEach(f=>c[f]=$(f).value);localStorage.setItem(K+':cfg',JSON.stringify(c))}catch(e){}}
function loadCfg(){try{const c=JSON.parse(localStorage.getItem(K+':cfg')||'{}');F.forEach(f=>{if(c[f]!==undefined)$(f).value=c[f]})}catch(e){}}
function saveState(){try{localStorage.setItem(K+':state',JSON.stringify(S))}catch(e){status('Could not save to browser storage; use Export state.',true)}}
function loadState(){try{S=JSON.parse(localStorage.getItem(K+':state')||'null')}catch(e){S=null}}

function extractJson(t){const m=t.match(/```(?:json)?\s*(\{[\s\S]*\})\s*```/);if(m)t=m[1];else{const i=t.indexOf('{'),j=t.lastIndexOf('}');if(i<0||j<0)throw 0;t=t.slice(i,j+1)}return JSON.parse(t)}
async function callModel(system,user,max){
 const key=$('key').value.trim(),model=$('model').value.trim();let r,j;
 if($('provider').value==='gemini'){
  r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:{maxOutputTokens:max,responseMimeType:'application/json'}})});
  j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status+': '+(j.error&&j.error.message||'request failed'));
  return ((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('');
 }
 const base=$('base').value.trim().replace(/\/$/,'');
 r=await fetch(base+'/chat/completions',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},key?{Authorization:'Bearer '+key}:{}),body:JSON.stringify({model,max_tokens:max,messages:[{role:'system',content:system},{role:'user',content:user}]})});
 j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status+': '+(j.error&&(j.error.message||j.error)||'request failed'));
 return j.choices?.[0]?.message?.content||'';
}
async function ask(system,payload,max){
 let user=JSON.stringify(payload),last='';
 for(let a=0;a<4;a++){
  let text;
  try{text=await callModel(system,user,max)}catch(e){
   last=e instanceof TypeError?'Network or CORS error. Check the key, the URL and your connection.':e.message;
   if(/^429|quota|rate/i.test(last)){status(`Rate limit reached; waiting ${20*(a+1)}s. ${last.slice(0,90)}`);await sleep(20000*(a+1));continue}
   throw new Error(last)}
  await sleep(Math.max(0,+$('delay').value)*1000);
  try{return extractJson(text)}catch(_){last='The model did not return valid JSON.';user+='\n\nYour last reply was not valid JSON. Reply with ONLY the JSON object.'}
 }
 throw new Error(last||'Request failed.');
}

const KEYS={place:'places',being:'beings',object:'objects',faction:'factions'};
function cap(o,n){const k=Object.keys(o);while(k.length>n)delete o[k.shift()]}
function applyCreations(act){
 const w=S.world,made=[];
 (Array.isArray(act.creations)?act.creations:[]).slice(0,3).forEach(c=>{
  if(!c||!c.name)return;const kind=str(c.kind).toLowerCase(),name=str(c.name),desc=str(c.description);
  if(kind==='rule'){const e=name+': '+desc;if(!w.rules.includes(e))w.rules.push(e);w.rules=w.rules.slice(-20)}
  else{const k=KEYS[kind]||'objects';w[k]=D(w[k]);w[k][name]=desc;cap(w[k],30)}
  made.push(kind+' "'+name+'"')});
 return made;
}
function applyChanges(res){
 const w=S.world,c=S.character,wc=D(res.world_changes),cc=D(res.character_changes);
 if($('creator').value==='both')['places','factions'].forEach(k=>{w[k]=D(w[k]);Object.entries(D(wc[k])).forEach(([a,b])=>w[k][a]=str(b))});
 w.facts=L(w.facts).concat(L(wc.facts)).slice(-40);
 if(cc.mood)c.mood=str(cc.mood);
 c.memories=L(c.memories).concat(L(cc.add_memories)).slice(-25);
 Object.entries(D(cc.relationship_changes)).forEach(([a,b])=>c.relationships[a]=str(b));
 const dg=L(cc.dropped_goals).map(s=>s.toLowerCase());
 c.goals=L(c.goals).filter(g=>!dg.some(d=>d.includes(g.toLowerCase())||g.toLowerCase().includes(d))).concat(L(cc.new_goals)).slice(-6);
 const rs=L(res.resolved_threads).map(s=>s.toLowerCase());
 S.threads=L(S.threads).filter(t=>!rs.some(r=>r.includes(t.toLowerCase())||t.toLowerCase().includes(r))).concat(L(res.new_threads)).slice(-12);
 if(res.time_advance)S.clock=str(res.time_advance);
}
async function genesis(){
 status('Creating the world…');
 const g=await ask(P.genesis,{seed:$('seed').value||'surprise me'},4096),w=D(g.world),c=D(g.character);
 ['places','factions','beings','objects'].forEach(k=>w[k]=D(w[k]));w.facts=L(w.facts);w.rules=L(w.rules);
 ['goals','memories','traits','flaws','desires','fears','secrets'].forEach(k=>c[k]=L(c[k]));c.relationships=D(c.relationships);
 S={tick:0,clock:str(g.clock)||'Start',world:w,character:c,threads:L(g.threads),longMemory:'',style:'',story:[],whispers:[]};
}
async function tick(){
 const n=S.tick+1,recent=S.story.slice(-4).map(e=>({tick:e.tick,clock:e.clock,action:e.action,scene:e.scene.slice(0,1200)}));
 const ctx={tick:n,clock:S.clock,world:S.world,open_threads:S.threads,long_memory:S.longMemory,recent_scenes:recent,your_sheet:S.character};
 if(S.whispers.length){ctx.whisper_from_outside=S.whispers.join('\n');S.whispers=[]}
 status(`Tick ${n}: the character decides…`);
 const act=await ask(P.character,ctx,2048),made=applyCreations(act);
 status(`Tick ${n}: the world responds…`);
 const res=await ask(P.world,{tick:n,clock:S.clock,world:S.world,open_threads:S.threads,character_sheet:S.character,character_action:act,recent_scenes:recent,style_notes:S.style,
  creation_policy:$('creator').value==='both'?'You may add places, factions and complications of your own.':'ONLY the character creates. Do NOT invent new places, factions, beings or objects. Narrate, react, and let EXISTING beings and factions act and resist. Complications must come from what already exists.'},4096);
 applyChanges(res);S.tick=n;
 S.story.push({tick:n,clock:S.clock,action:str(act.action),thought:str(act.inner_thought),scene:str(res.scene).trim(),made});
}
async function reflect(){
 status('The character reflects…');
 const r=await ask(P.reflect,{character:S.character,long_memory:S.longMemory,recent_scenes:S.story.slice(-8).map(e=>({clock:e.clock,action:e.action,scene:e.scene.slice(0,800)})),open_threads:S.threads,style_notes:S.style},3072);
 S.longMemory=str(r.long_memory||S.longMemory).slice(0,3000);S.character.memories=[];
 const g=L(r.revised_goals);if(g.length)S.character.goals=g.slice(0,6);
 S.style=str(r.style_notes||S.style).slice(0,800);if(r.power)S.character.power=str(r.power).slice(0,600);
}

function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function renderSide(){
 const side=$('side');side.textContent='';if(!S)return;const c=S.character,w=S.world,me=h('div','me');
 me.append(h('h3',null,c.name||'Character'),h('p',null,c.concept||''),h('p',null,'Mood: '+(c.mood||'—')),h('p',null,'Power: '+(c.power||'—')),h('p',null,'Goals: '+(c.goals.join('; ')||'—')));side.append(me);
 const sec=(t,o)=>{const e=Object.entries(o);const d=h('details');d.append(h('summary',null,`${t} (${e.length})`));const dl=h('dl');e.forEach(([a,b])=>{dl.append(h('dt',null,a),h('dd',null,b))});d.append(dl);side.append(d)};
 sec('Beings',w.beings);sec('Places',w.places);sec('Objects',w.objects);sec('Factions',w.factions);
 const ls=(t,a)=>{const d=h('details');d.append(h('summary',null,`${t} (${a.length})`));a.forEach(x=>d.append(h('dd',null,x)));side.append(d)};
 ls('Rules',w.rules);ls('Open threads',S.threads);
}
function render(){
 const f=$('feed');f.textContent='';
 if(!S){f.append(h('p','empty','Nothing here yet. Add a free key, then press Begin.'));renderSide();return}
 f.append(h('h2',null,S.world.name||'Untitled world'),h('p','prem',S.world.premise||''));
 S.story.forEach(e=>{const a=h('article','scene');a.append(h('h3',null,'Tick '+e.tick+' · '+e.clock),h('p','prose',e.scene));
  if(e.thought)a.append(h('p','thought',S.character.name+' thinks: '+e.thought));
  if(e.made&&e.made.length)a.append(h('p','made','Created: '+e.made.join(', ')));f.append(a)});
 renderSide();if(f.lastElementChild)f.lastElementChild.scrollIntoView({block:'nearest'});
}
function ui(){$('begin').disabled=running;$('begin').textContent=S?'Continue':'Begin';$('pause').disabled=!running}
async function run(){
 if(running)return;saveCfg();
 if($('provider').value==='gemini'&&!$('key').value.trim()){status('Paste a Gemini API key first (free at aistudio.google.com/app/apikey).',true);return}
 if($('provider').value==='openai'&&!$('base').value.trim()){status('Enter the Base URL for your provider.',true);return}
 running=true;ui();let n=0;
 try{
  if(!S){await genesis();saveState();render()}
  while(running&&n<Math.max(1,+$('ticks').value)){
   await tick();if(S.tick%Math.max(1,+$('reflect').value)===0&&running)await reflect();
   saveState();render();n++}
  status(running?`Finished ${n} ticks. Press Continue to keep going.`:`Paused after ${n} ticks.`);
 }catch(e){status(e.message+' Progress is saved; press Continue to retry.',true)}
 running=false;saveState();ui();
}
$('begin').onclick=run;$('pause').onclick=()=>{running=false;status('Pausing after the current step…')};
$('reset').onclick=()=>{if(!confirm('Delete this world and start over?'))return;running=false;S=null;try{localStorage.removeItem(K+':state')}catch(e){}status('');render();ui()};
$('send').onclick=()=>{const t=$('whisper').value.trim();if(!S){status('Begin first, then whisper.',true);return}if(t){S.whispers.push(t);$('whisper').value='';saveState();status('Whisper queued for the next tick.')}};
$('exp').onclick=()=>S&&dl('blue-void-state.json',JSON.stringify(S,null,1),'application/json');
$('md').onclick=()=>{if(!S)return;dl('blue-void-story.md','# '+S.world.name+'\n\n*'+S.world.premise+'*\n\n'+S.story.map(e=>`## Tick ${e.tick} · ${e.clock}\n\n${e.scene}\n\n*${e.thought}*\n${e.made.length?'\n> Created: '+e.made.join(', ')+'\n':''}`).join('\n'),'text/markdown')};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.world||!o.character)throw 0;S=o;S.whispers=S.whispers||[];saveState();render();ui();status('State imported.')}catch(_){status('That file is not a valid saved world.',true)}})};
$('provider').onchange=()=>{const o=$('provider').value==='openai';$('baserow').hidden=!o;$('keyhelp').hidden=o;if(o&&$('model').value==='gemini-2.5-flash')$('model').value='';if(!o&&!$('model').value)$('model').value='gemini-2.5-flash'};
F.forEach(f=>$(f).addEventListener('change',saveCfg));
loadCfg();loadState();$('provider').onchange();render();ui();
</script></body></html>
